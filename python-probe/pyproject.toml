[project]
name = "python-probe"
version = "0.1.0"
description = "Python side of the platform-interop-tests cross-language compatibility harness."
requires-python = ">=3.12"
dependencies = [
    "pgcommon",
    "eventcommon",
    "platform-fastapicommon",
    "prometheus-client>=0.20",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "fastapi>=0.110",
]

# Relative paths (not absolute) so this pyproject.toml resolves identically on any machine/CI
# runner that checks out the three Python sibling repos under a `python/` subdirectory next to
# platform-interop-tests — see .github/workflows/interop.yml for the exact checkout layout this
# depends on, and README.md for the local-dev equivalent. Same mechanism platform-eventcommon and
# platform-pgcommon-py already use for each other (`[tool.uv.sources]`), not a one-off here.
[tool.uv.sources]
pgcommon = { path = "../../python/platform-pgcommon-py", editable = true }
eventcommon = { path = "../../python/platform-eventcommon", editable = true }
platform-fastapicommon = { path = "../../python/platform-fastapicommon", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["probe"]
