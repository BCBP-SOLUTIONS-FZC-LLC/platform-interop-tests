name: platform-interop-tests

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: interop
    ports:
      - "${INTEROP_POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./docker/init-rls.sql:/docker-entrypoint-initdb.d/init-rls.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interop"]
      interval: 2s
      timeout: 3s
      retries: 30

  floci:
    # Floci — open-source (MIT), always-free AWS emulator; the platform's drop-in LocalStack
    # replacement, pinned to the image platform-events uses (its docker-compose.yml /
    # .docker-digests). Every service (SNS, SQS, …) is on :4566 with no SERVICES selection or
    # auth token. The -compat image bundles the AWS CLI the healthcheck uses. The events
    # checks create their own topics and queues, so no init hook is needed.
    image: floci/floci:2.1.0-compat@sha256:bb98b11f837bdacdda21ce6635a0773509e50aa471c35be9332a9efef502127c
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      FLOCI_DEFAULT_ACCOUNT_ID: "000000000000"
    ports:
      - "${INTEROP_FLOCI_PORT:-54566}:4566"
    healthcheck:
      # --region is required: floci isolates resources per region.
      test: ["CMD", "aws", "--region", "us-east-1", "sqs", "list-queues"]
      interval: 2s
      timeout: 5s
      retries: 30
